name: Update live status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live status from Cloudflare Worker
        env:
          APARAT_STATUS_URL: https://uniquetaha-live-status.tahakazrwny.workers.dev/live-status
        run: python3 update_live_status.py
      - name: Commit status when changed or stale
        run: |
          git config user.name "live-status-bot"
          git config user.email "live-status-bot@users.noreply.github.com"
          git add live-status.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore: update live status"
            git pull --rebase --autostash
            git push
          fi
